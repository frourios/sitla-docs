name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Documents and independent conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Check for secrets
        run: npm run secretlint
      - name: Verify schemas, bytes, signatures and rejection layers
        run: npm test
      - name: Set up independent Python verifier
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install locked Python verification dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Verify with Python JSON Schema and ML-DSA implementations
        run: npm run test:python
